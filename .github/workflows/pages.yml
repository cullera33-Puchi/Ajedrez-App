# Publica la app en GitHub Pages en cada push a main: https://cullera33-puchi.github.io/Ajedrez-App/
# La ruta distingue mayúsculas, así que la base se toma del nombre real del repositorio.
name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Problemas sin conexión: se genera un paquete a partir de la base de problemas de Lichess (CC0).
      # La base se guarda en caché un mes para no descargarla en cada publicación. Si falla, la app
      # se publica igual y usa el set de iniciación.
      - id: month
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        with:
          path: /tmp/lichess_db_puzzle.csv.zst
          key: lichess-puzzles-${{ steps.month.outputs.month }}
      - name: Paquete de problemas de Lichess
        continue-on-error: true
        run: |
          [ -s /tmp/lichess_db_puzzle.csv.zst ] || curl -fsSL --retry 3 -o /tmp/lichess_db_puzzle.csv.zst https://database.lichess.org/lichess_db_puzzle.csv.zst
          zstdcat /tmp/lichess_db_puzzle.csv.zst | node scripts/build-puzzle-pack.mjs public/puzzles/pack.json | tee /tmp/pack.log
          echo "::notice title=Paquete de problemas::$(tail -1 /tmp/pack.log)"
      - name: Aviso si no hay paquete
        if: hashFiles('public/puzzles/pack.json') == ''
        run: echo "::warning title=Paquete de problemas::No se ha generado; la app usará el set de iniciación." 
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Código de acceso de 4 cifras (Settings, Secrets and variables, Actions). Si no existe,
          # la app no pide código.
          APP_PIN: ${{ secrets.APP_PIN }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
